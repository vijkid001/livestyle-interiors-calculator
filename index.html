<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LiveStyle Interiors - Smart Estimation Platform</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#222222"/>

  <link rel="stylesheet" href="style.css"/>


</head>

<body>

<div class="container">

  <h1>LiveStyle Interiors</h1>

  <p class="sub-title">
    Smart Interior Estimation Platform
  </p>

  <label>Select Estimation Type</label>

  <select id="calcType" onchange="toggleSections()">
    <option value="default">Default</option>
    <option value="custom">Customized</option>
  </select>

  <!-- DEFAULT SECTION -->

  <div id="defaultSection">

    <h2>Default Estimation</h2>

    <label>Select House Type</label>

    <select id="bhkType">
      <option value="2">2 BHK</option>
      <option value="3">3 BHK</option>
      <option value="4">4 BHK</option>
      <option value="5">5 BHK</option>
      <option value="6">Villa</option>
    </select>

    <label>Laminate %</label>
    <input type="number" id="defaultLaminate" value="40">

    <label>Acrylic %</label>
    <input type="number" id="defaultAcrylic" value="30">

    <label>Glass %</label>
    <input type="number" id="defaultGlass" value="20">

    <label>Lights %</label>
    <input type="number" id="defaultLights" value="10">

    <label>Select Base Material</label>

    <select id="defaultMaterial">
      <option value="Ultra">Ultra</option>
      <option value="Good">Good</option>
      <option value="Economy">Economy</option>
    </select>
	
	 <label>Kitchen Included?</label>

	<div style="display:flex;gap:20px;margin-top:10px;">
	  <label>
		<input type="radio" name="defaultKitchen" value="yes" checked>
		With Kitchen
	  </label>

	  <label>
		<input type="radio" name="defaultKitchen" value="no">
		Without Kitchen
	  </label>
	</div>

  </div>

  <!-- CUSTOMIZED SECTION -->

  <div id="customSection" class="hidden">

    <h2>Customized Estimation</h2>

    <label>How Many Rooms?</label>

    <input type="number" id="roomCount" min="1">

    <button onclick="generateRooms()">
      Generate Rooms
    </button>

    <div id="roomsContainer"></div>

    <label>Select Base Material</label>

    <select id="customMaterial">
      <option value="Ultra">Ultra</option>
      <option value="Good">Good</option>
      <option value="Economy">Economy</option>
    </select>
	
	label>Kitchen Included?</label>

	<div style="display:flex;gap:20px;margin-top:10px;">
	  <label>
		<input type="radio" name="customKitchen" value="yes" checked>
		With Kitchen
	  </label>

	  <label>
		<input type="radio" name="customKitchen" value="no">
		Without Kitchen
	  </label>
	</div>

  </div>

  <button onclick="calculateEstimate()">
    Calculate Estimation
  </button>

  <!-- RESULT -->

  <div class="result">

    <h2>Estimation Result</h2>

    <div class="summary-box">

      <p>
        <strong>Total Sq Ft:</strong>
        <span id="totalSqft">0</span>
      </p>

      <p>
        <strong>Material Cost:</strong>
        ₹ <span id="materialCost">0</span>
      </p>

      <p>
        <strong>Labour Cost:</strong>
        ₹ <span id="labourCost">0</span>
      </p>

      <p>
        <strong>Total Cost:</strong>
        ₹ <span id="totalCost">0</span>
      </p>

    </div>

    <hr>

    <h2>Calculation Breakdown</h2>

    <div id="calculationBreakdown"></div>

  </div>

</div>

<script src="app.js"></script>


<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
  }
</script>
</body>
</html>
